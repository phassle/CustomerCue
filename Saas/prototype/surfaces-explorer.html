<!doctype html>
<!--
  CustomerCue — Saas 1.0 surfaces explorer (built on top of the locked Variant A).
  THROWAWAY. Once the surface variants are picked, the winners fold into the real
  Saas/ Next.js app (PRD: github.com/phassle/CustomerCue/issues/55) and this file
  gets deleted.

  Forked from variant-a-standalone.html on 2026-05-13 to layer five new surfaces
  on top of the locked Variant A Triage Inbox backdrop:
    S1 — Paste-classify (/classify)
    S2 — Account drilldown
    S3 — Send-to-owner
    S4 — [stub] rationale treatment
    S5 — /login user picker

  The Variant A inbox itself is NOT touched — it sits underneath every overlay
  surface, so each surface variant is judged against the real product chrome.

  Usage:
    open Saas/prototype/surfaces-explorer.html
    ?surface=inbox|classify|drilldown|sendto|stub|login   (default: inbox)
    ?variant=A|B|C                                         (per non-inbox surface)
    ?layout=1|2|3 and ?sort=…                              (inbox-only, retained)
  Keys:
    1/2/3 — layout (inbox only)
    ←/→  — cycle variant within current surface
    Click the surface tabs at the top to switch surface.

  Data is fictional. Canonical signal names (docs/signals.md) used verbatim. Every
  signal renders with linked source conversations (trust contract).
-->
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>CustomerCue — Saas 1.0 surfaces explorer</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400;9..144,500;9..144,600&family=Geist:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
  html, body { font-family: 'Geist', system-ui, sans-serif; }
  .mono { font-family: 'JetBrains Mono', ui-monospace, monospace; }

  /* =================================================================== */
  /* Variant A — Editorial Triage Inbox.                                  */
  /* All styling scoped under .va so the surrounding page chrome is       */
  /* free to evolve in a follow-up design session.                        */
  /* =================================================================== */
  .va {
    --paper:        #F7F3EC;
    --paper-deep:   #EFE7D5;
    --paper-tint:   #FBF8F2;
    --surface:      #FFFFFF;
    --ink:          #1B1916;
    --ink-soft:     #3D372F;
    --ink-mute:     #847C70;
    --ink-faint:    #B5AC9E;
    --rule:         #E5DFD3;
    --rule-strong:  #C9C0AE;
    --risk:         #8C2D2D;
    --risk-soft:    #F4E5DE;
    --expand:       #2A5D3C;
    --expand-soft:  #DDE9DD;
    --accent:       #B8893C;
    --accent-soft:  #F0E1C4;
    background: var(--paper);
    color: var(--ink);
    font-family: 'Geist', system-ui, sans-serif;
    font-feature-settings: 'ss01','cv11';
    letter-spacing: -0.003em;
    height: calc(100vh - 32px);
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }
  .va * { box-sizing: border-box; }
  .va button { font-family: inherit; cursor: pointer; border: none; background: none; padding: 0; color: inherit; }
  .va .serif { font-family: 'Fraunces', Georgia, 'Times New Roman', serif; font-variation-settings: 'opsz' 48, 'SOFT' 50; }
  .va .mono  { font-family: 'JetBrains Mono', ui-monospace, monospace; letter-spacing: 0; }
  .va kbd {
    font-family: 'JetBrains Mono', monospace;
    font-size: 9.5px;
    padding: 1px 5px;
    background: var(--paper);
    border: 1px solid var(--rule-strong);
    border-bottom-width: 2px;
    border-radius: 3px;
    color: var(--ink-soft);
    text-transform: uppercase;
    letter-spacing: 0.04em;
    line-height: 1.4;
  }
  .va .text-risk   { color: var(--risk); }
  .va .text-expand { color: var(--expand); }

  /* topbar ----------------------------------------------------------- */
  .va-topbar {
    flex-shrink: 0;
    display: grid;
    grid-template-columns: auto minmax(0, 1fr) auto auto auto;
    align-items: center;
    gap: 22px;
    padding: 0 24px;
    height: 56px;
    background: var(--surface);
    border-bottom: 1px solid var(--rule);
  }
  .va-brand { display: flex; align-items: center; gap: 10px; }
  .va-brand-mark {
    font-family: 'Fraunces', serif;
    font-variation-settings: 'opsz' 40;
    font-weight: 600;
    font-size: 16px;
    letter-spacing: -0.02em;
    background: var(--ink);
    color: var(--paper);
    width: 28px; height: 28px;
    display: grid; place-items: center;
    border-radius: 4px;
  }
  .va-brand-name {
    font-family: 'Fraunces', serif;
    font-variation-settings: 'opsz' 24;
    font-weight: 500;
    font-size: 15.5px;
    letter-spacing: -0.018em;
    color: var(--ink);
  }
  .va-brand-workspace {
    font-size: 10.5px;
    color: var(--ink-mute);
    padding-left: 12px;
    margin-left: 4px;
    border-left: 1px solid var(--rule);
    letter-spacing: 0.04em;
  }
  .va-search {
    display: flex; align-items: center; gap: 10px;
    height: 32px;
    padding: 0 12px;
    background: var(--paper);
    border: 1px solid var(--rule);
    border-radius: 4px;
    color: var(--ink-mute);
    font-size: 12.5px;
    max-width: 380px;
    transition: border-color .15s;
    cursor: text;
  }
  .va-search:hover { border-color: var(--rule-strong); }
  .va-search-icon { color: var(--ink-faint); font-size: 13px; }
  .va-search > kbd { margin-left: auto; }
  .va-kbd-hints { display: flex; gap: 14px; font-size: 10.5px; color: var(--ink-mute); }
  .va-kbd-hints span { display: inline-flex; align-items: center; gap: 4px; letter-spacing: 0.02em; }
  .va-sync { font-size: 10.5px; color: var(--ink-mute); display: flex; align-items: center; gap: 5px; }
  .va-sync::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: var(--expand); box-shadow: 0 0 0 2px var(--expand-soft); }
  .va-avatar {
    width: 30px; height: 30px;
    border-radius: 50%;
    background: var(--ink);
    color: var(--paper);
    display: grid; place-items: center;
    font-size: 10.5px; font-weight: 600; letter-spacing: 0.06em;
  }

  /* grid ------------------------------------------------------------- */
  .va-grid {
    flex: 1;
    min-height: 0;
    display: grid;
    grid-template-columns: 56px 380px minmax(0, 1fr);
    overflow: hidden;
  }

  /* icon rail */
  .va-iconrail {
    background: var(--surface);
    border-right: 1px solid var(--rule);
    padding: 12px 0;
    display: flex; flex-direction: column;
    align-items: center;
    gap: 2px;
  }
  .va-icon {
    width: 38px; height: 38px;
    border-radius: 6px;
    color: var(--ink-mute);
    font-size: 16px;
    display: grid; place-items: center;
    transition: background .15s, color .15s;
  }
  .va-icon:hover { background: var(--paper); color: var(--ink); }
  .va-icon.is-active { background: var(--ink); color: var(--paper); }
  .va-iconrail-spacer { flex: 1; }

  /* queue ------------------------------------------------------------ */
  .va-queue {
    background: var(--surface);
    border-right: 1px solid var(--rule);
    display: flex; flex-direction: column;
    min-height: 0;
  }
  .va-queue-header {
    display: flex; align-items: flex-end; justify-content: space-between;
    gap: 12px;
    padding: 18px 20px 14px;
    border-bottom: 1px solid var(--rule);
  }
  .va-eyebrow {
    font-size: 9.5px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--ink-mute);
    font-weight: 600;
  }
  .va-queue-title {
    font-family: 'Fraunces', serif;
    font-variation-settings: 'opsz' 72;
    font-size: 26px;
    font-weight: 400;
    letter-spacing: -0.028em;
    margin: 4px 0 0 0;
    color: var(--ink);
    line-height: 1;
  }
  .va-queue-meta {
    display: flex; align-items: center; gap: 8px;
    font-size: 11px;
    color: var(--ink-mute);
  }
  .va-queue-meta strong { color: var(--ink); font-weight: 600; font-family: 'JetBrains Mono', monospace; font-size: 12px; }
  .va-queue-meta .text-risk strong { color: var(--risk); }
  .va-dot { width: 3px; height: 3px; border-radius: 50%; background: var(--ink-faint); display: inline-block; }

  .va-queue-toolbar {
    display: flex; align-items: center; gap: 4px;
    padding: 8px 14px;
    border-bottom: 1px solid var(--rule);
    background: var(--paper-tint);
  }
  .va-queue-toolbar button {
    font-size: 11px;
    padding: 4px 9px;
    border-radius: 3px;
    color: var(--ink-soft);
    transition: background .12s, color .12s;
  }
  .va-queue-toolbar button:hover { color: var(--ink); }
  .va-queue-toolbar button.is-active {
    background: var(--surface);
    color: var(--ink);
    box-shadow: inset 0 0 0 1px var(--rule-strong);
  }
  .va-queue-sort {
    margin-left: auto;
    font-size: 10px;
    color: var(--ink-mute);
    letter-spacing: 0.04em;
  }

  .va-queue-list {
    list-style: none; padding: 0; margin: 0;
    overflow-y: auto; flex: 1; min-height: 0;
  }
  .va-item {
    display: grid;
    grid-template-columns: 26px 1fr;
    gap: 12px;
    padding: 14px 18px 14px 14px;
    border-bottom: 1px solid var(--rule);
    cursor: pointer;
    position: relative;
    transition: background .15s;
    animation: vaItemIn 0.4s ease-out backwards;
    animation-delay: calc(var(--i, 0) * 22ms);
  }
  @keyframes vaItemIn {
    from { opacity: 0; transform: translateY(4px); }
    to   { opacity: 1; transform: none; }
  }
  .va-item:hover { background: var(--paper-tint); }
  .va-item.is-active { background: var(--paper); }
  .va-item.is-active::before {
    content: ''; position: absolute;
    left: 0; top: 0; bottom: 0; width: 3px;
    background: var(--tone, var(--ink));
  }
  .va-item-rank {
    font-size: 10.5px;
    color: var(--ink-faint);
    padding-top: 3px;
    text-align: right;
    font-weight: 500;
  }
  .va-item.is-active .va-item-rank { color: var(--ink-soft); }
  .va-item-row1 { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
  .va-type { display: inline-flex; align-items: center; gap: 6px; }
  .va-type-dot { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; }
  .va-type-name {
    font-size: 11px;
    color: var(--ink-soft);
    letter-spacing: -0.005em;
    font-weight: 500;
  }
  .va-item-time {
    margin-left: auto;
    font-size: 10px;
    color: var(--ink-faint);
  }
  .va-item-account {
    font-family: 'Fraunces', serif;
    font-variation-settings: 'opsz' 28, 'SOFT' 40;
    font-size: 17px;
    font-weight: 500;
    letter-spacing: -0.018em;
    color: var(--ink);
    line-height: 1.08;
  }
  .va-item-meta {
    font-size: 10.5px;
    color: var(--ink-mute);
    margin-top: 4px;
    letter-spacing: 0;
  }
  .va-item-summary {
    font-size: 12.5px;
    color: var(--ink-soft);
    margin-top: 7px;
    line-height: 1.42;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .va-item-foot {
    display: flex; align-items: center;
    gap: 8px; margin-top: 9px;
  }
  .va-urgency {
    font-size: 9px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    font-weight: 600;
    padding: 2px 7px;
    border-radius: 2px;
  }
  .va-urgency.u-high   { color: var(--risk);     background: var(--risk-soft); }
  .va-urgency.u-medium { color: var(--accent);   background: var(--accent-soft); }
  .va-urgency.u-low    { color: var(--ink-mute); background: var(--paper-deep); }
  .va-item-tix { font-size: 10.5px; color: var(--ink-mute); }
  .va-item-current {
    margin-left: auto;
    font-size: 10px;
    color: var(--ink);
    letter-spacing: 0.04em;
    font-weight: 600;
  }

  /* detail ----------------------------------------------------------- */
  .va-detail {
    overflow-y: auto;
    background: var(--paper);
    background-image:
      radial-gradient(ellipse at top right, rgba(255,255,255,0.6), transparent 50%),
      radial-gradient(ellipse at bottom left, rgba(184,137,60,0.035), transparent 60%);
  }
  .va-detail-inner {
    max-width: 880px;
    padding: 36px 56px 80px;
    margin: 0 auto;
    animation: vaFadeIn 0.5s ease-out backwards;
    animation-delay: 0.08s;
  }
  @keyframes vaFadeIn {
    from { opacity: 0; transform: translateY(8px); }
    to   { opacity: 1; transform: none; }
  }

  .va-trail {
    display: flex; gap: 10px;
    font-size: 11px;
    color: var(--ink-mute);
    letter-spacing: 0.04em;
    margin-bottom: 24px;
    align-items: center;
  }
  .va-trail-sep { color: var(--ink-faint); }
  .va-trail-current { color: var(--ink); }

  .va-headline-row {
    display: flex; align-items: center;
    gap: 10px; flex-wrap: wrap;
    margin-bottom: 18px;
  }
  .va-type-tag {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 5px 14px 5px 11px;
    background: var(--surface);
    border: 1px solid var(--rule-strong);
    border-radius: 999px;
    font-size: 11.5px;
    color: var(--ink);
    font-weight: 500;
  }
  .va-detected { font-size: 11px; color: var(--ink-mute); }
  .va-pill-btn {
    font-size: 11.5px;
    padding: 5px 12px;
    background: transparent;
    border: 1px solid var(--rule-strong);
    border-radius: 4px;
    color: var(--ink-soft);
    transition: background .15s, color .15s, border-color .15s;
  }
  .va-pill-btn:hover { background: var(--surface); color: var(--ink); border-color: var(--ink); }
  .va-pill-btn.va-share { margin-left: auto; }

  .va-headline {
    font-family: 'Fraunces', serif;
    font-size: clamp(48px, 5.4vw, 76px);
    font-weight: 400;
    letter-spacing: -0.042em;
    line-height: 0.94;
    font-variation-settings: 'opsz' 144, 'SOFT' 30;
    color: var(--ink);
    margin: 0;
  }

  .va-meta-strip {
    display: flex; align-items: baseline;
    gap: 18px;
    margin: 18px 0 32px;
    flex-wrap: wrap;
    font-size: 13px;
    color: var(--ink);
  }
  .va-meta-strip > span:not(.va-meta-rule) {
    display: inline-flex; align-items: baseline; gap: 8px;
  }
  .va-meta-strip em {
    font-style: normal;
    color: var(--ink-mute);
    text-transform: uppercase;
    font-size: 9.5px;
    letter-spacing: 0.14em;
    font-weight: 600;
  }
  .va-meta-strip strong {
    font-weight: 500;
    font-family: 'Fraunces', serif;
    font-variation-settings: 'opsz' 24;
    font-size: 15px;
    letter-spacing: -0.015em;
  }
  .va-meta-rule { width: 1px; height: 12px; background: var(--rule-strong); align-self: center; }

  .va-pullquote {
    margin: 32px 0 4px;
    padding: 14px 0 14px 24px;
    border-left: 2px solid var(--ink);
  }
  .va-pullquote .va-eyebrow { margin-bottom: 8px; }
  .va-pullquote p {
    font-family: 'Fraunces', serif;
    font-variation-settings: 'opsz' 48, 'SOFT' 50;
    font-size: 22px;
    font-weight: 350;
    line-height: 1.42;
    margin: 0;
    color: var(--ink);
    letter-spacing: -0.018em;
  }

  .va-stats {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    margin: 36px 0;
    border-top: 1px solid var(--ink);
    border-bottom: 1px solid var(--ink);
  }
  .va-stat {
    padding: 18px 18px 18px;
    border-right: 1px solid var(--rule);
    background: var(--paper-tint);
  }
  .va-stat:last-child { border-right: 0; }
  .va-stat-label {
    font-size: 9.5px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--ink-mute);
    font-weight: 600;
  }
  .va-stat-row { display: flex; align-items: center; gap: 10px; }
  .va-stat-value {
    font-family: 'Fraunces', serif;
    font-size: 34px;
    font-weight: 400;
    letter-spacing: -0.038em;
    line-height: 1;
    margin-top: 10px;
    font-variation-settings: 'opsz' 96;
    color: var(--ink);
  }
  .va-stat-sub {
    font-size: 10.5px;
    color: var(--ink-mute);
    margin-top: 8px;
    letter-spacing: 0.02em;
  }
  .va-sparkline { width: 70px; height: 22px; margin-top: 14px; opacity: 0.9; flex-shrink: 0; }
  .va-stat-impact { background: var(--risk-soft); }
  .va-stat-impact .va-stat-label { color: var(--risk); }
  .va-stat-impact .va-stat-value { color: var(--risk); }

  .va-sources { margin-top: 44px; }
  .va-section-header {
    display: flex; justify-content: space-between;
    align-items: flex-end;
    padding-bottom: 12px;
    border-bottom: 2px solid var(--ink);
    margin-bottom: 0;
    gap: 16px;
  }
  .va-section-subtitle {
    font-size: 12.5px;
    color: var(--ink-mute);
    margin: 4px 0 0;
    font-style: italic;
    font-family: 'Fraunces', serif;
    font-variation-settings: 'opsz' 18, 'ital' 1;
    font-weight: 350;
  }
  .va-section-subtitle .mono { font-style: normal; }

  .va-source-list { list-style: none; padding: 0; margin: 0; }
  .va-source-row {
    display: grid;
    grid-template-columns: 110px minmax(0, 1fr) 90px 20px;
    gap: 18px;
    padding: 16px 12px;
    border-bottom: 1px solid var(--rule);
    align-items: start;
    transition: background .15s;
    cursor: pointer;
    margin: 0 -12px;
  }
  .va-source-row:hover { background: var(--surface); }
  .va-source-meta { display: flex; flex-direction: column; gap: 4px; padding-top: 2px; }
  .va-source-channel {
    font-size: 9.5px;
    letter-spacing: 0.18em;
    color: var(--ink);
    font-weight: 600;
    text-transform: uppercase;
  }
  .va-source-id {
    font-size: 10px;
    color: var(--ink-faint);
    letter-spacing: 0.02em;
  }
  .va-source-subject {
    font-size: 14.5px;
    color: var(--ink);
    font-weight: 500;
    letter-spacing: -0.012em;
    line-height: 1.3;
  }
  .va-source-snippet {
    font-size: 12.5px;
    color: var(--ink-mute);
    margin-top: 5px;
    line-height: 1.5;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .va-source-date {
    font-size: 11px;
    color: var(--ink-mute);
    padding-top: 3px;
    text-align: right;
  }
  .va-source-arrow {
    color: var(--ink-faint);
    font-size: 14px;
    transition: transform .2s, color .2s;
    padding-top: 2px;
  }
  .va-source-row:hover .va-source-arrow {
    color: var(--ink);
    transform: translate(2px, -2px);
  }

  /* actions ---------------------------------------------------------- */
  .va-actions {
    margin-top: 44px;
    padding: 22px 24px 22px;
    background: var(--surface);
    border: 1px solid var(--ink);
    position: relative;
  }
  .va-actions::before {
    content: '';
    position: absolute;
    top: -1px; left: -1px; right: -1px;
    height: 4px;
    background: var(--ink);
  }
  .va-actions-head {
    display: flex; align-items: baseline;
    justify-content: space-between;
    flex-wrap: wrap; gap: 12px;
  }
  .va-actions-sub {
    font-size: 11.5px;
    color: var(--ink-mute);
    margin: 0;
    font-family: 'Fraunces', serif;
    font-variation-settings: 'opsz' 18, 'ital' 1;
    font-weight: 350;
    font-style: italic;
  }
  .va-action-buttons {
    display: flex; flex-wrap: wrap;
    gap: 6px; margin-top: 16px;
  }
  .va-action-buttons button {
    display: inline-flex; align-items: center;
    gap: 10px;
    font-size: 12.5px;
    padding: 9px 14px;
    border-radius: 2px;
    transition: background .15s, color .15s, border-color .15s;
    font-weight: 500;
  }
  .va-action-primary {
    background: var(--ink); color: var(--paper);
  }
  .va-action-primary kbd {
    background: rgba(247,243,236,.14);
    border-color: rgba(247,243,236,.22);
    color: var(--paper);
    border-bottom-width: 1px;
  }
  .va-action-primary:hover { background: var(--ink-soft); }
  .va-action-secondary {
    background: var(--paper);
    box-shadow: inset 0 0 0 1px var(--rule-strong);
    color: var(--ink);
  }
  .va-action-secondary:hover { background: var(--surface); box-shadow: inset 0 0 0 1px var(--ink); }
  .va-action-ghost {
    background: transparent;
    color: var(--ink-mute);
    margin-left: auto;
    font-weight: 400;
  }
  .va-action-ghost:hover { color: var(--ink); }

  /* listing switcher (inside queue toolbar) -------------------------- */
  .va-listing-tabs {
    display: inline-flex;
    background: var(--surface);
    border: 1px solid var(--rule-strong);
    border-radius: 4px;
    padding: 2px;
  }
  .va-listing-tab {
    display: inline-flex; align-items: center;
    gap: 6px;
    font-size: 11px;
    color: var(--ink-soft);
    padding: 4px 9px;
    border-radius: 3px;
    transition: background .15s, color .15s;
    font-weight: 500;
  }
  .va-listing-tab:hover { color: var(--ink); }
  .va-listing-tab.is-active {
    background: var(--ink);
    color: var(--paper);
  }
  .va-listing-tab kbd {
    font-size: 8.5px;
    padding: 0 4px;
    background: transparent;
    border: 1px solid var(--rule-strong);
    border-bottom-width: 1px;
    color: var(--ink-faint);
    border-radius: 2px;
    line-height: 1.5;
  }
  .va-listing-tab.is-active kbd {
    background: rgba(247,243,236,.10);
    border-color: rgba(247,243,236,.22);
    color: rgba(247,243,236,.72);
  }

  /* sort dropdown ---------------------------------------------------- */
  .va-sort {
    position: relative;
    margin-left: auto;
  }
  .va-sort > summary {
    list-style: none;
    display: inline-flex; align-items: center;
    gap: 6px;
    font-size: 11px;
    color: var(--ink-soft);
    padding: 5px 8px 5px 10px;
    cursor: pointer;
    border-radius: 4px;
    transition: background .15s, color .15s, box-shadow .15s;
    letter-spacing: 0.02em;
    font-weight: 500;
    user-select: none;
  }
  .va-sort > summary::-webkit-details-marker { display: none; }
  .va-sort > summary::marker { display: none; content: ''; }
  .va-sort > summary:hover { color: var(--ink); background: var(--surface); }
  .va-sort[open] > summary {
    background: var(--surface);
    color: var(--ink);
    box-shadow: inset 0 0 0 1px var(--ink);
  }
  .va-sort-arrow { color: var(--ink-mute); font-size: 11px; }
  .va-sort[open] .va-sort-arrow { color: var(--ink); }
  .va-sort-current { font-weight: 500; }
  .va-sort-chev { font-size: 9px; color: var(--ink-mute); transition: transform .15s; }
  .va-sort[open] .va-sort-chev { transform: rotate(180deg); color: var(--ink); }

  .va-sort-menu {
    position: absolute;
    right: 0; top: calc(100% + 6px);
    background: var(--surface);
    border: 1px solid var(--ink);
    border-radius: 4px;
    min-width: 240px;
    z-index: 30;
    padding: 4px;
    box-shadow: 0 10px 28px -10px rgba(27,25,22,.18),
                0 2px 0 0 var(--ink);
    animation: vaSortIn .15s ease-out;
  }
  @keyframes vaSortIn {
    from { opacity: 0; transform: translateY(-4px); }
    to   { opacity: 1; transform: none; }
  }
  .va-sort-eyebrow {
    padding: 8px 10px 4px;
    color: var(--ink-mute);
  }
  .va-sort-opt {
    display: flex; flex-direction: column;
    align-items: flex-start; gap: 2px;
    width: 100%;
    padding: 8px 10px 9px;
    border-radius: 3px;
    text-align: left;
    cursor: pointer;
    transition: background .12s;
    position: relative;
  }
  .va-sort-opt:hover { background: var(--paper-tint); }
  .va-sort-opt.is-active { background: var(--paper); }
  .va-sort-opt.is-active::before {
    content: '';
    position: absolute;
    left: 0; top: 8px; bottom: 8px;
    width: 2px;
    background: var(--ink);
    border-radius: 2px;
  }
  .va-sort-opt-label {
    font-size: 12.5px;
    color: var(--ink);
    font-weight: 500;
    letter-spacing: -0.005em;
  }
  .va-sort-opt-desc {
    font-size: 10.5px;
    color: var(--ink-mute);
    letter-spacing: 0;
  }

  /* type divider (used in cards + ledger when sort=type) ------------- */
  .va-type-divider {
    display: grid;
    grid-template-columns: 3px 1fr auto;
    align-items: stretch;
    background: var(--paper-tint);
    border-top: 1px solid var(--rule-strong);
    border-bottom: 1px solid var(--rule);
    list-style: none;
    cursor: default;
  }
  .va-type-divider:first-child { border-top: 0; }
  .va-type-divider-bar { background: var(--tone, var(--ink)); }
  .va-type-divider-label {
    font-size: 10px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--ink);
    font-weight: 600;
    padding: 9px 0 9px 14px;
    display: flex; align-items: center;
  }
  .va-type-divider-count {
    font-size: 10.5px;
    color: var(--ink-mute);
    padding: 0 14px;
    display: flex; align-items: center;
  }
  .va-type-divider--thin .va-type-divider-label { padding-top: 6px; padding-bottom: 6px; font-size: 9.5px; letter-spacing: 0.18em; }
  .va-type-divider--thin .va-type-divider-count { font-size: 10px; }

  /* listing 2 — ledger ----------------------------------------------- */
  .va-list-ledger {
    list-style: none; padding: 0; margin: 0;
    overflow-y: auto; flex: 1; min-height: 0;
  }
  .va-ledger-row {
    display: grid;
    grid-template-columns: 22px 6px minmax(0, 1fr) auto 18px 32px;
    align-items: center;
    gap: 10px;
    padding: 8px 16px 8px 12px;
    border-bottom: 1px solid var(--rule);
    cursor: pointer;
    position: relative;
    transition: background .15s;
    animation: vaItemIn 0.35s ease-out backwards;
    animation-delay: calc(var(--i, 0) * 14ms);
  }
  .va-ledger-row:hover { background: var(--paper-tint); }
  .va-ledger-row.is-active { background: var(--paper); }
  .va-ledger-row.is-active::before {
    content: ''; position: absolute;
    left: 0; top: 0; bottom: 0; width: 3px;
    background: var(--tone, var(--ink));
  }
  .va-ledger-rank {
    font-size: 10.5px;
    color: var(--ink-faint);
    text-align: right;
    font-weight: 500;
  }
  .va-ledger-row.is-active .va-ledger-rank { color: var(--ink-soft); }
  .va-ledger-dot {
    width: 6px; height: 6px; border-radius: 50%;
    justify-self: center;
  }
  .va-ledger-account {
    font-family: 'Fraunces', serif;
    font-variation-settings: 'opsz' 22;
    font-size: 14.5px;
    font-weight: 500;
    letter-spacing: -0.015em;
    color: var(--ink);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .va-ledger-arr {
    font-size: 11px;
    color: var(--ink-soft);
    font-weight: 600;
    text-align: right;
    letter-spacing: 0.01em;
  }
  .va-ledger-urgency {
    font-size: 9.5px;
    font-weight: 700;
    width: 18px; height: 16px;
    display: grid; place-items: center;
    border-radius: 2px;
    letter-spacing: 0;
  }
  .va-ledger-urgency.u-high   { background: var(--risk);       color: var(--paper); }
  .va-ledger-urgency.u-medium { background: var(--accent);     color: var(--paper); }
  .va-ledger-urgency.u-low    { background: var(--paper-deep); color: var(--ink-mute); }
  .va-ledger-time {
    font-size: 10px;
    color: var(--ink-mute);
    text-align: right;
    letter-spacing: 0;
  }

  /* listing 3 — grouped by signal type ------------------------------- */
  .va-list-grouped {
    list-style: none; padding: 0; margin: 0;
    overflow-y: auto; flex: 1; min-height: 0;
  }
  .va-group {
    border-bottom: 1px solid var(--rule);
    animation: vaItemIn 0.4s ease-out backwards;
    animation-delay: calc(var(--gi, 0) * 50ms);
  }
  .va-group-header {
    display: grid;
    grid-template-columns: 4px 1fr auto auto;
    align-items: stretch;
    background: var(--paper-tint);
    border-bottom: 1px solid var(--rule);
    cursor: pointer;
    min-height: 34px;
  }
  .va-group-bar {
    background: var(--tone, var(--ink));
    align-self: stretch;
  }
  .va-group-name {
    font-size: 10.5px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    font-weight: 600;
    padding: 10px 0 10px 14px;
    color: var(--ink);
    display: flex;
    align-items: center;
  }
  .va-group-count {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--ink-mute);
    padding: 0 10px;
    display: flex;
    align-items: center;
  }
  .va-group-toggle {
    width: 28px;
    color: var(--ink-mute);
    display: flex; align-items: center; justify-content: center;
    font-size: 11px;
  }
  .va-group-items {
    list-style: none; padding: 0; margin: 0;
    background: var(--surface);
  }
  .va-group-item {
    display: grid;
    grid-template-columns: 24px 1fr;
    gap: 12px;
    padding: 12px 18px 12px 14px;
    border-bottom: 1px solid var(--rule);
    cursor: pointer;
    position: relative;
    transition: background .15s;
  }
  .va-group-item:last-child { border-bottom: 0; }
  .va-group-item:hover { background: var(--paper-tint); }
  .va-group-item.is-active { background: var(--paper); }
  .va-group-item.is-active::before {
    content: ''; position: absolute;
    left: 0; top: 0; bottom: 0; width: 3px;
    background: var(--tone, var(--ink));
  }
  .va-group-item-rank {
    font-size: 10.5px;
    color: var(--ink-faint);
    padding-top: 3px;
    text-align: right;
    font-weight: 500;
  }
  .va-group-item-head {
    display: flex; align-items: baseline;
    gap: 10px; margin-bottom: 5px;
  }
  .va-group-item-account {
    font-family: 'Fraunces', serif;
    font-variation-settings: 'opsz' 24;
    font-size: 15px;
    font-weight: 500;
    letter-spacing: -0.014em;
    color: var(--ink);
    flex: 1;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .va-group-item-arr {
    font-size: 10.5px;
    color: var(--ink-mute);
    font-weight: 500;
  }
  .va-group-item-time {
    font-size: 10px;
    color: var(--ink-faint);
  }
  .va-group-item-summary {
    font-size: 12px;
    color: var(--ink-soft);
    line-height: 1.42;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .va-group-item-foot {
    display: flex; align-items: center;
    gap: 10px; margin-top: 6px;
  }

  /* status bar ------------------------------------------------------- */
  .va-statusbar {
    flex-shrink: 0;
    display: flex; align-items: center;
    gap: 14px;
    height: 30px;
    padding: 0 20px;
    background: var(--ink);
    color: rgba(247,243,236,.72);
    font-size: 10.5px;
    letter-spacing: 0.04em;
  }
  .va-statusbar-dot {
    width: 3px; height: 3px; border-radius: 50%;
    background: rgba(247,243,236,.3);
  }
  .va-statusbar-fill { flex: 1; }
  .va-statusbar-cta {
    color: var(--accent);
    letter-spacing: 0.08em;
    font-weight: 600;
    text-transform: uppercase;
    font-size: 10px;
  }

  /* =================================================================== */
  /* Surfaces explorer chrome — sits ABOVE the locked Variant A inbox.   */
  /* All prototype-only styles prefixed with `.px-` so they cannot leak  */
  /* into the real Saas/ app when winners are folded back in.            */
  /* =================================================================== */
  :root {
    --paper:        #F7F3EC;
    --paper-deep:   #EFE7D5;
    --paper-tint:   #FBF8F2;
    --surface:      #FFFFFF;
    --ink:          #1B1916;
    --ink-soft:     #3D372F;
    --ink-mute:     #847C70;
    --ink-faint:    #B5AC9E;
    --rule:         #E5DFD3;
    --rule-strong:  #C9C0AE;
    --risk:         #8C2D2D;
    --risk-soft:    #F4E5DE;
    --expand:       #2A5D3C;
    --expand-soft:  #DDE9DD;
    --accent:       #B8893C;
    --accent-soft:  #F0E1C4;
  }

  .px-topbar {
    height: 32px;
    display: flex;
    align-items: stretch;
    gap: 14px;
    padding: 0 14px;
    background: var(--ink);
    color: rgba(247,243,236,.78);
    font-family: 'Geist', system-ui, sans-serif;
    font-size: 11px;
    border-bottom: 1px solid #000;
  }
  .px-topbar-brand { display: flex; align-items: center; gap: 9px; }
  .px-topbar-mark {
    width: 20px; height: 20px;
    background: var(--paper); color: var(--ink);
    display: grid; place-items: center;
    border-radius: 3px;
    font-family: 'Fraunces', serif;
    font-variation-settings: 'opsz' 40;
    font-size: 10.5px; font-weight: 600;
    letter-spacing: -0.02em;
  }
  .px-topbar-name { color: var(--paper); font-weight: 500; letter-spacing: 0.01em; }
  .px-topbar-warn {
    font-size: 9.5px;
    text-transform: uppercase;
    letter-spacing: 0.14em;
    color: var(--accent);
    padding-left: 10px;
    margin-left: 4px;
    border-left: 1px solid rgba(247,243,236,.15);
  }
  .px-topbar-tabs { display: flex; align-items: stretch; gap: 1px; margin: 0 auto; }
  .px-topbar-tab {
    border: none; background: none;
    padding: 0 12px;
    color: rgba(247,243,236,.55);
    font-size: 11px;
    font-family: inherit;
    letter-spacing: 0.01em;
    display: inline-flex; align-items: center; gap: 8px;
    cursor: pointer;
    transition: color .12s, background .12s;
  }
  .px-topbar-tab:hover { color: var(--paper); background: rgba(247,243,236,.04); }
  .px-topbar-tab.is-active {
    color: var(--paper); font-weight: 500;
    background: rgba(247,243,236,.08);
    box-shadow: inset 0 -2px 0 var(--accent);
  }
  .px-topbar-tab .px-tab-num {
    font-family: 'JetBrains Mono', monospace;
    font-size: 9px;
    opacity: 0.55;
    border: 1px solid rgba(247,243,236,.2);
    border-radius: 2px;
    padding: 0 4px;
    line-height: 1.5;
  }
  .px-topbar-stack {
    align-self: center;
    font-size: 9.5px;
    color: rgba(247,243,236,.4);
    letter-spacing: 0.06em;
    text-transform: uppercase;
  }

  /* Floating variant pill at bottom-center */
  .px-variant-bar {
    position: fixed; left: 50%; bottom: 18px;
    transform: translateX(-50%);
    background: var(--ink);
    color: var(--paper);
    border-radius: 22px;
    padding: 5px 6px 5px 12px;
    display: flex; align-items: center; gap: 8px;
    box-shadow: 0 22px 44px -22px rgba(27,25,22,.6), 0 4px 10px -4px rgba(27,25,22,.35);
    z-index: 60;
    font-size: 11.5px;
    font-family: 'Geist', sans-serif;
  }
  .px-variant-bar[hidden] { display: none; }
  .px-variant-bar .label {
    padding: 0 6px; min-width: 220px;
    text-align: center;
  }
  .px-variant-bar .label .key {
    font-family: 'JetBrains Mono', monospace;
    color: var(--accent-soft);
    font-size: 10px; margin-right: 6px;
    letter-spacing: 0.03em;
  }
  .px-variant-bar .label b { color: var(--paper); font-weight: 500; }
  .px-variant-bar button {
    border: none; background: rgba(255,255,255,.07);
    color: var(--paper);
    width: 28px; height: 28px;
    border-radius: 50%;
    font-size: 15px;
    line-height: 1;
    display: grid; place-items: center;
    cursor: pointer;
    transition: background .15s;
    font-family: inherit;
  }
  .px-variant-bar button:hover { background: rgba(255,255,255,.18); }

  /* Overlay root — fixed below topbar, hosts all surface overlays + pages */
  #px-overlay-root {
    position: fixed;
    top: 32px; left: 0; right: 0; bottom: 0;
    pointer-events: none;
    z-index: 40;
    font-family: 'Geist', system-ui, sans-serif;
    color: var(--ink);
  }
  #px-overlay-root > * { pointer-events: auto; }

  /* When a full-page surface (classify, login) is active, hide the inbox */
  body.px-fullpage #app { display: none; }
  body.px-fullpage #px-overlay-root { background: var(--paper); }

  /* Generic small UI bits used across surfaces */
  .px-chip {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 3px 10px;
    background: var(--paper);
    border: 1px solid var(--rule);
    border-radius: 999px;
    font-size: 11px;
    color: var(--ink-soft);
  }
  .px-chip.high { background: var(--risk-soft); color: var(--risk); border-color: transparent; font-weight: 600; }
  .px-chip.med  { background: var(--accent-soft); color: var(--accent); border-color: transparent; font-weight: 600; }
  .px-chip.low  { background: var(--expand-soft); color: var(--expand); border-color: transparent; font-weight: 600; }
  .px-type-pill {
    display: inline-flex; align-items: center; gap: 7px;
    font-size: 11.5px; color: var(--ink-soft); font-weight: 500;
  }
  .px-type-pill::before {
    content: ''; width: 7px; height: 7px; border-radius: 50%;
    background: var(--tone, var(--ink));
  }
  .px-eyebrow {
    font-size: 9.5px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--ink-mute);
    font-weight: 600;
  }
  .px-field-label {
    display: block;
    font-size: 10px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--ink-mute);
    margin-bottom: 7px;
    font-weight: 600;
  }
  .px-field-help { font-size: 11.5px; color: var(--ink-mute); }
  .px-seg {
    display: inline-flex;
    border: 1px solid var(--rule-strong);
    border-radius: 4px;
    background: var(--surface);
    padding: 2px;
    gap: 2px;
  }
  .px-seg button {
    border: none; background: none;
    padding: 5px 11px;
    border-radius: 3px;
    font-size: 11.5px;
    color: var(--ink-soft);
    cursor: pointer;
    font-family: inherit;
  }
  .px-seg button.is-active {
    background: var(--ink); color: var(--paper);
    font-weight: 500;
  }
  .px-textarea, .px-input, .px-select {
    font-family: inherit;
    color: var(--ink);
    border: 1px solid var(--rule-strong);
    border-radius: 3px;
    background: var(--surface);
    padding: 10px 12px;
    font-size: 13px;
    width: 100%;
    outline: none;
  }
  .px-textarea { resize: vertical; min-height: 160px; line-height: 1.5; font-family: 'JetBrains Mono', monospace; font-size: 12px; }
  .px-textarea:focus, .px-input:focus, .px-select:focus { border-color: var(--ink); }

  .px-btn {
    display: inline-flex; align-items: center; gap: 9px;
    padding: 9px 16px;
    border: 1px solid transparent;
    border-radius: 3px;
    font-size: 12.5px;
    font-weight: 500;
    font-family: inherit;
    cursor: pointer;
    letter-spacing: 0.01em;
  }
  .px-btn-primary { background: var(--ink); color: var(--paper); }
  .px-btn-primary:hover { background: var(--ink-soft); }
  .px-btn-primary kbd {
    background: rgba(247,243,236,.14);
    border-color: rgba(247,243,236,.22);
    color: var(--paper);
    border-bottom-width: 1px;
  }
  .px-btn-secondary { background: var(--paper); color: var(--ink); box-shadow: inset 0 0 0 1px var(--rule-strong); }
  .px-btn-secondary:hover { box-shadow: inset 0 0 0 1px var(--ink); }
  .px-btn-ghost { background: transparent; color: var(--ink-mute); }
  .px-btn-ghost:hover { color: var(--ink); }

  /* Note ribbon shown at the top of every surface (variant description) */
  .px-note {
    position: absolute;
    top: 14px; left: 50%; transform: translateX(-50%);
    max-width: 760px;
    width: max-content;
    background: var(--surface);
    border: 1px solid var(--rule-strong);
    border-left: 3px solid var(--accent);
    border-radius: 3px;
    padding: 8px 14px 8px 12px;
    font-size: 11.5px;
    color: var(--ink-soft);
    line-height: 1.45;
    box-shadow: 0 8px 22px -14px rgba(27,25,22,.25);
    z-index: 70;
  }
  .px-note .mono { color: var(--accent); font-weight: 600; margin-right: 8px; }

  /* =================================================================== */
  /* S1 — Paste-classify (full-page surface, replaces inbox)             */
  /* =================================================================== */
  .px-page {
    position: absolute; inset: 0;
    background: var(--paper);
    overflow-y: auto;
    padding: 64px 40px 80px;
  }
  .px-page-inner { max-width: 760px; margin: 0 auto; }
  .px-page-eyebrow { font-size: 10px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--ink-mute); font-weight: 600; }
  .px-page-headline {
    font-family: 'Fraunces', serif;
    font-variation-settings: 'opsz' 96;
    font-size: 44px; font-weight: 400;
    letter-spacing: -0.038em; line-height: 1.02;
    margin: 6px 0 8px;
    color: var(--ink);
  }
  .px-page-lede {
    font-family: 'Fraunces', serif;
    font-variation-settings: 'opsz' 18, 'ital' 1;
    font-weight: 350; font-style: italic;
    font-size: 14.5px;
    color: var(--ink-mute);
    max-width: 580px;
    margin: 0 0 32px;
    line-height: 1.5;
  }

  /* S1·A — single-pane */
  .s1a-form {
    background: var(--surface);
    border: 1px solid var(--rule-strong);
    border-radius: 4px;
    padding: 32px 38px;
  }
  .s1a-form .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; margin-top: 18px; }
  .s1a-submit { margin-top: 22px; display: flex; align-items: center; gap: 14px; }
  .s1a-result {
    margin-top: 26px;
    background: var(--paper-tint);
    border: 1px solid var(--rule);
    border-left: 3px solid var(--tone, var(--ink));
    border-radius: 4px;
    padding: 22px 26px;
    animation: pxHi 1.6s ease-out 1;
  }
  @keyframes pxHi {

const fmtMoney = n => '$' + (n >= 1000 ? (n/1000).toFixed(n>=10000?0:1) + 'k' : n);
const fmtMoneyFull = n => '$' + n.toLocaleString('en-US');
const accountById = id => accounts.find(a => a.id === id);
const ticketsForSignal = s => s.ticketIds.map(id => tickets[id]).filter(Boolean);

// Same canonical type keys as docs/signals.md; harmonised to the cream background.

  'churn risk':                   '#8C2D2D',
  'expansion intent':             '#2A5D3C',
  'product friction':             '#B8893C',
  'bug cluster':                  '#C25A1F',
  'onboarding issue':             '#2D5C8C',
  'feature request':              '#5A3C8C',
  'negative sentiment':           '#8C2D5C',
  'strategic account escalation': '#A02020',
  'documentation gap':            '#4A453E',
  'repeated manual workaround':   '#2D7C7C',
};

function ticketRef(t) {
  const num = String(t.id.replace(/^t/, '')).padStart(3, '0');
  const prefix = t.channel === 'intercom' ? 'IC' : t.channel === 'zendesk' ? 'ZD' : 'EM';
  return `${prefix}·${num}`;
}

// Fake but stable 7-point sentiment trajectory ending near `sentiment`.
function vaSparklinePoints(sentiment) {
  const seed = Math.abs(Math.round(sentiment * 137));
  const pts = [];
  for (let i = 0; i < 7; i++) {
    const noise = (((seed + i * 23) % 11) - 5) / 32;
    const drift = sentiment * (i / 6);
    const v = drift + noise;
    const x = (i / 6) * 70;
    const y = 11 - v * 14;
    pts.push(`${i === 0 ? 'M' : 'L'}${x.toFixed(1)},${y.toFixed(1)}`);
  }
  return pts.join(' ');
}

// ARR-weighted urgency score for sorting (rough).
const score = s => (s.urgency === 'high' ? 3 : s.urgency === 'medium' ? 2 : 1) * Math.log10(accountById(s.accountId).arr + 1);

const escapeHtml = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

  surface: 'inbox',  // inbox|classify|drilldown|sendto|stub|login

};

const SORT_MODES = [
  { key: 'priority', label: 'Priority', desc: 'ARR × urgency'           },
  { key: 'arr',      label: 'ARR',      desc: 'Largest accounts first'  },
  { key: 'recent',   label: 'Recent',   desc: 'Newest signals first'    },
  { key: 'urgency',  label: 'Urgency',  desc: 'High → low'              },
  { key: 'type',     label: 'Type',     desc: 'Grouped by signal type'  },
];
const SORT_KEYS = SORT_MODES.map(m => m.key);

function sortLabel(key) {
  return (SORT_MODES.find(m => m.key === key) || SORT_MODES[0]).label;
}
function urgencyRank(u) { return u === 'high' ? 3 : u === 'medium' ? 2 : 1; }
function recencyHours(s) {
  const t = (s.detectedAt || '').toLowerCase();
  if (t === 'yesterday') return 24;
  const m = t.match(/(\d+)\s*(hour|day|week|month)/);
  if (!m) return 9999;
  const n = parseInt(m[1], 10);
  const u = m[2];
  return n * (u === 'hour' ? 1 : u === 'day' ? 24 : u === 'week' ? 168 : 720);
}
function applySort(list) {
  const copy = [...list];
  switch (state.sort) {
    case 'arr':      copy.sort((a,b) => accountById(b.accountId).arr - accountById(a.accountId).arr || score(b) - score(a)); break;
    case 'recent':   copy.sort((a,b) => recencyHours(a) - recencyHours(b) || score(b) - score(a)); break;
    case 'urgency':  copy.sort((a,b) => urgencyRank(b.urgency) - urgencyRank(a.urgency) || score(b) - score(a)); break;
    case 'type':     copy.sort((a,b) => a.type.localeCompare(b.type) || score(b) - score(a)); break;
    case 'priority':
    default:         copy.sort((a,b) => score(b) - score(a));
  }
  return copy;
}
function countByType(list) {
  const m = new Map();
  for (const s of list) m.set(s.type, (m.get(s.type) || 0) + 1);
  return m;
}

function readStateFromUrl() {
  const url = new URL(window.location);
  const l = parseInt(url.searchParams.get('layout'), 10);
  if (l >= 1 && l <= 3) state.listing = l;
  const s = url.searchParams.get('sort');
  if (s && SORT_KEYS.includes(s)) state.sort = s;
}

function persistListing() {
  const url = new URL(window.location);
  url.searchParams.set('layout', String(state.listing));
  window.history.replaceState({}, '', url);
}

function persistSort() {
  const url = new URL(window.location);
  url.searchParams.set('sort', state.sort);
  window.history.replaceState({}, '', url);
}

// "2 days ago" -> "2d", "1 week ago" -> "1w", "yesterday" -> "1d"
function shortTime(s) {
  if (!s) return '';
  if (s === 'yesterday') return '1d';
  const m = s.match(/(\d+)\s*(day|week|month|hour)/i);
  if (m) return m[1] + m[2][0].toLowerCase();
  return s;
}

/* ------- URL state ------------------------------------------------- */
function readStateFromUrlExtras() {
  const params = new URL(window.location).searchParams;
  const s = params.get('surface');
  if (s && SURFACES.find(x => x.key === s)) state.surface = s;
  const surf = SURFACES.find(x => x.key === state.surface);
  const v = params.get('variant');
  if (v && surf.variants.includes(v)) state.variant = v;
  else state.variant = surf.variants[0];
}
function persistSurfaceState() {
  const url = new URL(window.location);
  url.searchParams.set('surface', state.surface);
  url.searchParams.set('variant', state.variant);
  window.history.replaceState({}, '', url);
}

/* ------- Surface tabs (top dark bar) ------------------------------ */
function populateSurfaceTabs() {
  const tabs = document.getElementById('px-tabs');
  if (!tabs) return;
  if (tabs.dataset.populated !== 'true') {
    tabs.innerHTML = SURFACES.map(s =>
      `<button class="px-topbar-tab" data-px-surface="${s.key}">
         <span class="px-tab-num">${s.num}</span>
         <span>${escapeHtml(s.tab)}</span>
       </button>`
    ).join('');
    tabs.addEventListener('click', e => {
      const t = e.target.closest('[data-px-surface]');
      if (t) setSurface(t.getAttribute('data-px-surface'));
    });
    tabs.dataset.populated = 'true';
  }
  tabs.querySelectorAll('.px-topbar-tab').forEach(btn =>
    btn.classList.toggle('is-active', btn.getAttribute('data-px-surface') === state.surface)
  );
}

function setSurface(key) {
  const surf = SURFACES.find(x => x.key === key);
  if (!surf) return;
  state.surface = key;
  state.variant = surf.variants[0];
  persistSurfaceState();
  render();
}
function cycleVariant(dir) {
  const surf = SURFACES.find(x => x.key === state.surface);
  if (surf.variants.length <= 1) return;
  const i = surf.variants.indexOf(state.variant);
  state.variant = surf.variants[(i + dir + surf.variants.length) % surf.variants.length];
  persistSurfaceState();
  render();
}

}

/* ------- Surface-aware render ------------------------------------- */
function render() {
  populateSurfaceTabs();
  const fullpage = state.surface === 'classify' || state.surface === 'login';
  document.body.classList.toggle('px-fullpage', fullpage);

  if (!fullpage) {
    document.getElementById('app').innerHTML = renderVariantA();
  } else {
    document.getElementById('app').innerHTML = '';
  }

  const overlayRoot = document.getElementById('px-overlay-root');
  overlayRoot.innerHTML = '';
  if (state.surface === 'classify')   overlayRoot.appendChild(renderClassifySurface(state.variant));
  if (state.surface === 'drilldown')  overlayRoot.appendChild(renderDrilldownSurface(state.variant));
  if (state.surface === 'sendto')     overlayRoot.appendChild(renderSendtoSurface(state.variant));
  if (state.surface === 'login')      overlayRoot.appendChild(renderLoginSurface(state.variant));

  // Inline mutations into the inbox detail (overlay-free surfaces)
  if (state.surface === 'stub') {
    applyStubTreatment(state.variant);
    overlayRoot.innerHTML = noteRibbonHtml('stub', state.variant);
  }
  if (state.surface === 'drilldown' && state.variant === 'C')  injectS2CInline();
  if (state.surface === 'sendto'    && state.variant === 'C')  injectS3CInline();

  // Variant bar at bottom
  const bar = document.getElementById('px-variant-bar');
  const surf = SURFACES.find(x => x.key === state.surface);
  if (state.surface === 'inbox' || surf.variants.length <= 1) {
    bar.hidden = true;
    bar.innerHTML = '';
  } else {
    bar.hidden = false;
    bar.innerHTML =
      `<button data-px-cycle="-1">‹</button>` +
      `<span class="label"><span class="key">S${surf.num}·${state.variant}</span><b>${escapeHtml(surf.names[state.variant])}</b></span>` +
      `<button data-px-cycle="1">›</button>`;
  }
}

/* ------- Wiring ---------------------------------------------------- */
document.addEventListener('click', e => {
  // Variant cycling arrows
  const cyc = e.target.closest('[data-px-cycle]');
  if (cyc) { cycleVariant(parseInt(cyc.getAttribute('data-px-cycle'), 10)); return; }
  // close any open sort popover when clicking outside of it
  if (!e.target.closest('.va-sort')) {
    document.querySelectorAll('.va-sort[open]').forEach(d => d.removeAttribute('open'));
  }
  const t = e.target.closest('[data-act]');
  if (!t) return;
  const act = t.getAttribute('data-act');
  if (act === 'select-signal') { state.selectedSignalId = t.getAttribute('data-id'); render(); }
  if (act === 'set-listing')   { state.listing = parseInt(t.getAttribute('data-id'), 10); persistListing(); render(); }
  if (act === 'set-sort')      { state.sort = t.getAttribute('data-id'); persistSort(); render(); }
});

document.addEventListener('keydown', e => {
  const tag = (e.target.tagName || '').toLowerCase();
  if (tag === 'input' || tag === 'textarea' || tag === 'select' || e.target.isContentEditable) return;
  // ← / → cycle variants within the current non-inbox surface
  if (e.key === 'ArrowLeft')  { e.preventDefault(); cycleVariant(-1); return; }
  if (e.key === 'ArrowRight') { e.preventDefault(); cycleVariant(1);  return; }
  // 1 / 2 / 3 — layout (inbox only)
  if (state.surface === 'inbox' && (e.key === '1' || e.key === '2' || e.key === '3')) {
    state.listing = parseInt(e.key, 10);
    persistListing();
    render();
  }
});

readStateFromUrl();
readStateFromUrlExtras();
render();
