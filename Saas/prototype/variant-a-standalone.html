<!doctype html>
<!--
  CustomerCue — Variant A (Triage Inbox) — standalone export.
  Throwaway prototype. Drop into a fresh Claude design chat to keep iterating on A.

  Forked from Saas/prototype/index.html on 2026-05-12. Stripped of variants B and C
  and the floating main-variant switcher. Retained: editorial design, the 3 listing
  layouts (Cards / Ledger / Grouped — keys 1/2/3), the sort dropdown
  (Priority / ARR / Recent / Urgency / Type), URL params ?layout= and ?sort=.

  Data is fictional. Canonical signal names (docs/signals.md) used verbatim. Every
  signal renders with linked source conversations (trust contract).
-->
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>CustomerCue — Variant A (Triage Inbox)</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400;9..144,500;9..144,600&family=Geist:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
  html, body { font-family: 'Geist', system-ui, sans-serif; }
  .mono { font-family: 'JetBrains Mono', ui-monospace, monospace; }

  /* =================================================================== */
  /* Variant A — Editorial Triage Inbox.                                  */
  /* All styling scoped under .va so the surrounding page chrome is       */
  /* free to evolve in a follow-up design session.                        */
  /* =================================================================== */
  .va {
    --paper:        #F7F3EC;
    --paper-deep:   #EFE7D5;
    --paper-tint:   #FBF8F2;
    --surface:      #FFFFFF;
    --ink:          #1B1916;
    --ink-soft:     #3D372F;
    --ink-mute:     #847C70;
    --ink-faint:    #B5AC9E;
    --rule:         #E5DFD3;
    --rule-strong:  #C9C0AE;
    --risk:         #8C2D2D;
    --risk-soft:    #F4E5DE;
    --expand:       #2A5D3C;
    --expand-soft:  #DDE9DD;
    --accent:       #B8893C;
    --accent-soft:  #F0E1C4;
    background: var(--paper);
    color: var(--ink);
    font-family: 'Geist', system-ui, sans-serif;
    font-feature-settings: 'ss01','cv11';
    letter-spacing: -0.003em;
    height: calc(100vh - 32px);
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }
  .va * { box-sizing: border-box; }
  .va button { font-family: inherit; cursor: pointer; border: none; background: none; padding: 0; color: inherit; }
  .va .serif { font-family: 'Fraunces', Georgia, 'Times New Roman', serif; font-variation-settings: 'opsz' 48, 'SOFT' 50; }
  .va .mono  { font-family: 'JetBrains Mono', ui-monospace, monospace; letter-spacing: 0; }
  .va kbd {
    font-family: 'JetBrains Mono', monospace;
    font-size: 9.5px;
    padding: 1px 5px;
    background: var(--paper);
    border: 1px solid var(--rule-strong);
    border-bottom-width: 2px;
    border-radius: 3px;
    color: var(--ink-soft);
    text-transform: uppercase;
    letter-spacing: 0.04em;
    line-height: 1.4;
  }
  .va .text-risk   { color: var(--risk); }
  .va .text-expand { color: var(--expand); }

  /* topbar ----------------------------------------------------------- */
  .va-topbar {
    flex-shrink: 0;
    display: grid;
    grid-template-columns: auto minmax(0, 1fr) auto auto auto;
    align-items: center;
    gap: 22px;
    padding: 0 24px;
    height: 56px;
    background: var(--surface);
    border-bottom: 1px solid var(--rule);
  }
  .va-brand { display: flex; align-items: center; gap: 10px; }
  .va-brand-mark {
    font-family: 'Fraunces', serif;
    font-variation-settings: 'opsz' 40;
    font-weight: 600;
    font-size: 16px;
    letter-spacing: -0.02em;
    background: var(--ink);
    color: var(--paper);
    width: 28px; height: 28px;
    display: grid; place-items: center;
    border-radius: 4px;
  }
  .va-brand-name {
    font-family: 'Fraunces', serif;
    font-variation-settings: 'opsz' 24;
    font-weight: 500;
    font-size: 15.5px;
    letter-spacing: -0.018em;
    color: var(--ink);
  }
  .va-brand-workspace {
    font-size: 10.5px;
    color: var(--ink-mute);
    padding-left: 12px;
    margin-left: 4px;
    border-left: 1px solid var(--rule);
    letter-spacing: 0.04em;
  }
  .va-search {
    display: flex; align-items: center; gap: 10px;
    height: 32px;
    padding: 0 12px;
    background: var(--paper);
    border: 1px solid var(--rule);
    border-radius: 4px;
    color: var(--ink-mute);
    font-size: 12.5px;
    max-width: 380px;
    transition: border-color .15s;
    cursor: text;
  }
  .va-search:hover { border-color: var(--rule-strong); }
  .va-search-icon { color: var(--ink-faint); font-size: 13px; }
  .va-search > kbd { margin-left: auto; }
  .va-kbd-hints { display: flex; gap: 14px; font-size: 10.5px; color: var(--ink-mute); }
  .va-kbd-hints span { display: inline-flex; align-items: center; gap: 4px; letter-spacing: 0.02em; }
  .va-sync { font-size: 10.5px; color: var(--ink-mute); display: flex; align-items: center; gap: 5px; }
  .va-sync::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: var(--expand); box-shadow: 0 0 0 2px var(--expand-soft); }
  .va-avatar {
    width: 30px; height: 30px;
    border-radius: 50%;
    background: var(--ink);
    color: var(--paper);
    display: grid; place-items: center;
    font-size: 10.5px; font-weight: 600; letter-spacing: 0.06em;
  }

  /* grid ------------------------------------------------------------- */
  .va-grid {
    flex: 1;
    min-height: 0;
    display: grid;
    grid-template-columns: 56px 380px minmax(0, 1fr);
    overflow: hidden;
  }

  /* icon rail */
  .va-iconrail {
    background: var(--surface);
    border-right: 1px solid var(--rule);
    padding: 12px 0;
    display: flex; flex-direction: column;
    align-items: center;
    gap: 2px;
  }
  .va-icon {
    width: 38px; height: 38px;
    border-radius: 6px;
    color: var(--ink-mute);
    font-size: 16px;
    display: grid; place-items: center;
    transition: background .15s, color .15s;
  }
  .va-icon:hover { background: var(--paper); color: var(--ink); }
  .va-icon.is-active { background: var(--ink); color: var(--paper); }
  .va-iconrail-spacer { flex: 1; }

  /* queue ------------------------------------------------------------ */
  .va-queue {
    background: var(--surface);
    border-right: 1px solid var(--rule);
    display: flex; flex-direction: column;
    min-height: 0;
  }
  .va-queue-header {
    display: flex; align-items: flex-end; justify-content: space-between;
    gap: 12px;
    padding: 18px 20px 14px;
    border-bottom: 1px solid var(--rule);
  }
  .va-eyebrow {
    font-size: 9.5px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--ink-mute);
    font-weight: 600;
  }
  .va-queue-title {
    font-family: 'Fraunces', serif;
    font-variation-settings: 'opsz' 72;
    font-size: 26px;
    font-weight: 400;
    letter-spacing: -0.028em;
    margin: 4px 0 0 0;
    color: var(--ink);
    line-height: 1;
  }
  .va-queue-meta {
    display: flex; align-items: center; gap: 8px;
    font-size: 11px;
    color: var(--ink-mute);
  }
  .va-queue-meta strong { color: var(--ink); font-weight: 600; font-family: 'JetBrains Mono', monospace; font-size: 12px; }
  .va-queue-meta .text-risk strong { color: var(--risk); }
  .va-dot { width: 3px; height: 3px; border-radius: 50%; background: var(--ink-faint); display: inline-block; }

  .va-queue-toolbar {
    display: flex; align-items: center; gap: 4px;
    padding: 8px 14px;
    border-bottom: 1px solid var(--rule);
    background: var(--paper-tint);
  }
  .va-queue-toolbar button {
    font-size: 11px;
    padding: 4px 9px;
    border-radius: 3px;
    color: var(--ink-soft);
    transition: background .12s, color .12s;
  }
  .va-queue-toolbar button:hover { color: var(--ink); }
  .va-queue-toolbar button.is-active {
    background: var(--surface);
    color: var(--ink);
    box-shadow: inset 0 0 0 1px var(--rule-strong);
  }
  .va-queue-sort {
    margin-left: auto;
    font-size: 10px;
    color: var(--ink-mute);
    letter-spacing: 0.04em;
  }

  .va-queue-list {
    list-style: none; padding: 0; margin: 0;
    overflow-y: auto; flex: 1; min-height: 0;
  }
  .va-item {
    display: grid;
    grid-template-columns: 26px 1fr;
    gap: 12px;
    padding: 14px 18px 14px 14px;
    border-bottom: 1px solid var(--rule);
    cursor: pointer;
    position: relative;
    transition: background .15s;
    animation: vaItemIn 0.4s ease-out backwards;
    animation-delay: calc(var(--i, 0) * 22ms);
  }
  @keyframes vaItemIn {
    from { opacity: 0; transform: translateY(4px); }
    to   { opacity: 1; transform: none; }
  }
  .va-item:hover { background: var(--paper-tint); }
  .va-item.is-active { background: var(--paper); }
  .va-item.is-active::before {
    content: ''; position: absolute;
    left: 0; top: 0; bottom: 0; width: 3px;
    background: var(--tone, var(--ink));
  }
  .va-item-rank {
    font-size: 10.5px;
    color: var(--ink-faint);
    padding-top: 3px;
    text-align: right;
    font-weight: 500;
  }
  .va-item.is-active .va-item-rank { color: var(--ink-soft); }
  .va-item-row1 { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
  .va-type { display: inline-flex; align-items: center; gap: 6px; }
  .va-type-dot { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; }
  .va-type-name {
    font-size: 11px;
    color: var(--ink-soft);
    letter-spacing: -0.005em;
    font-weight: 500;
  }
  .va-item-time {
    margin-left: auto;
    font-size: 10px;
    color: var(--ink-faint);
  }
  .va-item-account {
    font-family: 'Fraunces', serif;
    font-variation-settings: 'opsz' 28, 'SOFT' 40;
    font-size: 17px;
    font-weight: 500;
    letter-spacing: -0.018em;
    color: var(--ink);
    line-height: 1.08;
  }
  .va-item-meta {
    font-size: 10.5px;
    color: var(--ink-mute);
    margin-top: 4px;
    letter-spacing: 0;
  }
  .va-item-summary {
    font-size: 12.5px;
    color: var(--ink-soft);
    margin-top: 7px;
    line-height: 1.42;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .va-item-foot {
    display: flex; align-items: center;
    gap: 8px; margin-top: 9px;
  }
  .va-urgency {
    font-size: 9px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    font-weight: 600;
    padding: 2px 7px;
    border-radius: 2px;
  }
  .va-urgency.u-high   { color: var(--risk);     background: var(--risk-soft); }
  .va-urgency.u-medium { color: var(--accent);   background: var(--accent-soft); }
  .va-urgency.u-low    { color: var(--ink-mute); background: var(--paper-deep); }
  .va-item-tix { font-size: 10.5px; color: var(--ink-mute); }
  .va-item-current {
    margin-left: auto;
    font-size: 10px;
    color: var(--ink);
    letter-spacing: 0.04em;
    font-weight: 600;
  }

  /* detail ----------------------------------------------------------- */
  .va-detail {
    overflow-y: auto;
    background: var(--paper);
    background-image:
      radial-gradient(ellipse at top right, rgba(255,255,255,0.6), transparent 50%),
      radial-gradient(ellipse at bottom left, rgba(184,137,60,0.035), transparent 60%);
  }
  .va-detail-inner {
    max-width: 880px;
    padding: 36px 56px 80px;
    margin: 0 auto;
    animation: vaFadeIn 0.5s ease-out backwards;
    animation-delay: 0.08s;
  }
  @keyframes vaFadeIn {
    from { opacity: 0; transform: translateY(8px); }
    to   { opacity: 1; transform: none; }
  }

  .va-trail {
    display: flex; gap: 10px;
    font-size: 11px;
    color: var(--ink-mute);
    letter-spacing: 0.04em;
    margin-bottom: 24px;
    align-items: center;
  }
  .va-trail-sep { color: var(--ink-faint); }
  .va-trail-current { color: var(--ink); }

  .va-headline-row {
    display: flex; align-items: center;
    gap: 10px; flex-wrap: wrap;
    margin-bottom: 18px;
  }
  .va-type-tag {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 5px 14px 5px 11px;
    background: var(--surface);
    border: 1px solid var(--rule-strong);
    border-radius: 999px;
    font-size: 11.5px;
    color: var(--ink);
    font-weight: 500;
  }
  .va-detected { font-size: 11px; color: var(--ink-mute); }
  .va-pill-btn {
    font-size: 11.5px;
    padding: 5px 12px;
    background: transparent;
    border: 1px solid var(--rule-strong);
    border-radius: 4px;
    color: var(--ink-soft);
    transition: background .15s, color .15s, border-color .15s;
  }
  .va-pill-btn:hover { background: var(--surface); color: var(--ink); border-color: var(--ink); }
  .va-pill-btn.va-share { margin-left: auto; }

  .va-headline {
    font-family: 'Fraunces', serif;
    font-size: clamp(48px, 5.4vw, 76px);
    font-weight: 400;
    letter-spacing: -0.042em;
    line-height: 0.94;
    font-variation-settings: 'opsz' 144, 'SOFT' 30;
    color: var(--ink);
    margin: 0;
  }

  .va-meta-strip {
    display: flex; align-items: baseline;
    gap: 18px;
    margin: 18px 0 32px;
    flex-wrap: wrap;
    font-size: 13px;
    color: var(--ink);
  }
  .va-meta-strip > span:not(.va-meta-rule) {
    display: inline-flex; align-items: baseline; gap: 8px;
  }
  .va-meta-strip em {
    font-style: normal;
    color: var(--ink-mute);
    text-transform: uppercase;
    font-size: 9.5px;
    letter-spacing: 0.14em;
    font-weight: 600;
  }
  .va-meta-strip strong {
    font-weight: 500;
    font-family: 'Fraunces', serif;
    font-variation-settings: 'opsz' 24;
    font-size: 15px;
    letter-spacing: -0.015em;
  }
  .va-meta-rule { width: 1px; height: 12px; background: var(--rule-strong); align-self: center; }

  .va-pullquote {
    margin: 32px 0 4px;
    padding: 14px 0 14px 24px;
    border-left: 2px solid var(--ink);
  }
  .va-pullquote .va-eyebrow { margin-bottom: 8px; }
  .va-pullquote p {
    font-family: 'Fraunces', serif;
    font-variation-settings: 'opsz' 48, 'SOFT' 50;
    font-size: 22px;
    font-weight: 350;
    line-height: 1.42;
    margin: 0;
    color: var(--ink);
    letter-spacing: -0.018em;
  }

  .va-stats {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    margin: 36px 0;
    border-top: 1px solid var(--ink);
    border-bottom: 1px solid var(--ink);
  }
  .va-stat {
    padding: 18px 18px 18px;
    border-right: 1px solid var(--rule);
    background: var(--paper-tint);
  }
  .va-stat:last-child { border-right: 0; }
  .va-stat-label {
    font-size: 9.5px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--ink-mute);
    font-weight: 600;
  }
  .va-stat-row { display: flex; align-items: center; gap: 10px; }
  .va-stat-value {
    font-family: 'Fraunces', serif;
    font-size: 34px;
    font-weight: 400;
    letter-spacing: -0.038em;
    line-height: 1;
    margin-top: 10px;
    font-variation-settings: 'opsz' 96;
    color: var(--ink);
  }
  .va-stat-sub {
    font-size: 10.5px;
    color: var(--ink-mute);
    margin-top: 8px;
    letter-spacing: 0.02em;
  }
  .va-sparkline { width: 70px; height: 22px; margin-top: 14px; opacity: 0.9; flex-shrink: 0; }
  .va-stat-impact { background: var(--risk-soft); }
  .va-stat-impact .va-stat-label { color: var(--risk); }
  .va-stat-impact .va-stat-value { color: var(--risk); }

  .va-sources { margin-top: 44px; }
  .va-section-header {
    display: flex; justify-content: space-between;
    align-items: flex-end;
    padding-bottom: 12px;
    border-bottom: 2px solid var(--ink);
    margin-bottom: 0;
    gap: 16px;
  }
  .va-section-subtitle {
    font-size: 12.5px;
    color: var(--ink-mute);
    margin: 4px 0 0;
    font-style: italic;
    font-family: 'Fraunces', serif;
    font-variation-settings: 'opsz' 18, 'ital' 1;
    font-weight: 350;
  }
  .va-section-subtitle .mono { font-style: normal; }

  .va-source-list { list-style: none; padding: 0; margin: 0; }
  .va-source-row {
    display: grid;
    grid-template-columns: 110px minmax(0, 1fr) 90px 20px;
    gap: 18px;
    padding: 16px 12px;
    border-bottom: 1px solid var(--rule);
    align-items: start;
    transition: background .15s;
    cursor: pointer;
    margin: 0 -12px;
  }
  .va-source-row:hover { background: var(--surface); }
  .va-source-meta { display: flex; flex-direction: column; gap: 4px; padding-top: 2px; }
  .va-source-channel {
    font-size: 9.5px;
    letter-spacing: 0.18em;
    color: var(--ink);
    font-weight: 600;
    text-transform: uppercase;
  }
  .va-source-id {
    font-size: 10px;
    color: var(--ink-faint);
    letter-spacing: 0.02em;
  }
  .va-source-subject {
    font-size: 14.5px;
    color: var(--ink);
    font-weight: 500;
    letter-spacing: -0.012em;
    line-height: 1.3;
  }
  .va-source-snippet {
    font-size: 12.5px;
    color: var(--ink-mute);
    margin-top: 5px;
    line-height: 1.5;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .va-source-date {
    font-size: 11px;
    color: var(--ink-mute);
    padding-top: 3px;
    text-align: right;
  }
  .va-source-arrow {
    color: var(--ink-faint);
    font-size: 14px;
    transition: transform .2s, color .2s;
    padding-top: 2px;
  }
  .va-source-row:hover .va-source-arrow {
    color: var(--ink);
    transform: translate(2px, -2px);
  }

  /* actions ---------------------------------------------------------- */
  .va-actions {
    margin-top: 44px;
    padding: 22px 24px 22px;
    background: var(--surface);
    border: 1px solid var(--ink);
    position: relative;
  }
  .va-actions::before {
    content: '';
    position: absolute;
    top: -1px; left: -1px; right: -1px;
    height: 4px;
    background: var(--ink);
  }
  .va-actions-head {
    display: flex; align-items: baseline;
    justify-content: space-between;
    flex-wrap: wrap; gap: 12px;
  }
  .va-actions-sub {
    font-size: 11.5px;
    color: var(--ink-mute);
    margin: 0;
    font-family: 'Fraunces', serif;
    font-variation-settings: 'opsz' 18, 'ital' 1;
    font-weight: 350;
    font-style: italic;
  }
  .va-action-buttons {
    display: flex; flex-wrap: wrap;
    gap: 6px; margin-top: 16px;
  }
  .va-action-buttons button {
    display: inline-flex; align-items: center;
    gap: 10px;
    font-size: 12.5px;
    padding: 9px 14px;
    border-radius: 2px;
    transition: background .15s, color .15s, border-color .15s;
    font-weight: 500;
  }
  .va-action-primary {
    background: var(--ink); color: var(--paper);
  }
  .va-action-primary kbd {
    background: rgba(247,243,236,.14);
    border-color: rgba(247,243,236,.22);
    color: var(--paper);
    border-bottom-width: 1px;
  }
  .va-action-primary:hover { background: var(--ink-soft); }
  .va-action-secondary {
    background: var(--paper);
    box-shadow: inset 0 0 0 1px var(--rule-strong);
    color: var(--ink);
  }
  .va-action-secondary:hover { background: var(--surface); box-shadow: inset 0 0 0 1px var(--ink); }
  .va-action-ghost {
    background: transparent;
    color: var(--ink-mute);
    margin-left: auto;
    font-weight: 400;
  }
  .va-action-ghost:hover { color: var(--ink); }

  /* listing switcher (inside queue toolbar) -------------------------- */
  .va-listing-tabs {
    display: inline-flex;
    background: var(--surface);
    border: 1px solid var(--rule-strong);
    border-radius: 4px;
    padding: 2px;
  }
  .va-listing-tab {
    display: inline-flex; align-items: center;
    gap: 6px;
    font-size: 11px;
    color: var(--ink-soft);
    padding: 4px 9px;
    border-radius: 3px;
    transition: background .15s, color .15s;
    font-weight: 500;
  }
  .va-listing-tab:hover { color: var(--ink); }
  .va-listing-tab.is-active {
    background: var(--ink);
    color: var(--paper);
  }
  .va-listing-tab kbd {
    font-size: 8.5px;
    padding: 0 4px;
    background: transparent;
    border: 1px solid var(--rule-strong);
    border-bottom-width: 1px;
    color: var(--ink-faint);
    border-radius: 2px;
    line-height: 1.5;

/* Helpers                                                              */
/* ------------------------------------------------------------------ */
const fmtMoney = n => '$' + (n >= 1000 ? (n/1000).toFixed(n>=10000?0:1) + 'k' : n);
const fmtMoneyFull = n => '$' + n.toLocaleString('en-US');
const accountById = id => accounts.find(a => a.id === id);
const ticketsForSignal = s => s.ticketIds.map(id => tickets[id]).filter(Boolean);

// Editorial colour map for variant A (paper/oxblood palette).
// Same canonical type keys as docs/signals.md; harmonised to the cream background.
const VA_TONE = {
  'churn risk':                   '#8C2D2D',
  'expansion intent':             '#2A5D3C',
  'product friction':             '#B8893C',
  'bug cluster':                  '#C25A1F',
  'onboarding issue':             '#2D5C8C',
  'feature request':              '#5A3C8C',
  'negative sentiment':           '#8C2D5C',
  'strategic account escalation': '#A02020',
  'documentation gap':            '#4A453E',
  'repeated manual workaround':   '#2D7C7C',
};

function ticketRef(t) {
  const num = String(t.id.replace(/^t/, '')).padStart(3, '0');
  const prefix = t.channel === 'intercom' ? 'IC' : t.channel === 'zendesk' ? 'ZD' : 'EM';
  return `${prefix}·${num}`;
}

// Fake but stable 7-point sentiment trajectory ending near `sentiment`.
function vaSparklinePoints(sentiment) {
  const seed = Math.abs(Math.round(sentiment * 137));
  const pts = [];
  for (let i = 0; i < 7; i++) {
    const noise = (((seed + i * 23) % 11) - 5) / 32;
    const drift = sentiment * (i / 6);
    const v = drift + noise;
    const x = (i / 6) * 70;
    const y = 11 - v * 14;
    pts.push(`${i === 0 ? 'M' : 'L'}${x.toFixed(1)},${y.toFixed(1)}`);
  }
  return pts.join(' ');
}

// ARR-weighted urgency score for sorting (rough).
const score = s => (s.urgency === 'high' ? 3 : s.urgency === 'medium' ? 2 : 1) * Math.log10(accountById(s.accountId).arr + 1);

const escapeHtml = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* ------------------------------------------------------------------ */
/* App state                                                            */
/* ------------------------------------------------------------------ */
const state = {
  selectedSignalId: 's1',
  listing: 1,        // 1=cards, 2=ledger, 3=grouped
  sort: 'priority',  // priority|arr|recent|urgency|type
};

const SORT_MODES = [
  { key: 'priority', label: 'Priority', desc: 'ARR × urgency'           },
  { key: 'arr',      label: 'ARR',      desc: 'Largest accounts first'  },
  { key: 'recent',   label: 'Recent',   desc: 'Newest signals first'    },
  { key: 'urgency',  label: 'Urgency',  desc: 'High → low'              },
  { key: 'type',     label: 'Type',     desc: 'Grouped by signal type'  },
];
const SORT_KEYS = SORT_MODES.map(m => m.key);

function sortLabel(key) {
  return (SORT_MODES.find(m => m.key === key) || SORT_MODES[0]).label;
}
function urgencyRank(u) { return u === 'high' ? 3 : u === 'medium' ? 2 : 1; }
function recencyHours(s) {
  const t = (s.detectedAt || '').toLowerCase();
  if (t === 'yesterday') return 24;
  const m = t.match(/(\d+)\s*(hour|day|week|month)/);
  if (!m) return 9999;
  const n = parseInt(m[1], 10);
  const u = m[2];
  return n * (u === 'hour' ? 1 : u === 'day' ? 24 : u === 'week' ? 168 : 720);
}
function applySort(list) {
  const copy = [...list];
  switch (state.sort) {
    case 'arr':      copy.sort((a,b) => accountById(b.accountId).arr - accountById(a.accountId).arr || score(b) - score(a)); break;
    case 'recent':   copy.sort((a,b) => recencyHours(a) - recencyHours(b) || score(b) - score(a)); break;
    case 'urgency':  copy.sort((a,b) => urgencyRank(b.urgency) - urgencyRank(a.urgency) || score(b) - score(a)); break;
    case 'type':     copy.sort((a,b) => a.type.localeCompare(b.type) || score(b) - score(a)); break;
    case 'priority':
    default:         copy.sort((a,b) => score(b) - score(a));
  }
  return copy;
}
function countByType(list) {
  const m = new Map();
  for (const s of list) m.set(s.type, (m.get(s.type) || 0) + 1);
  return m;
}

function readStateFromUrl() {
  const url = new URL(window.location);
  const l = parseInt(url.searchParams.get('layout'), 10);
  if (l >= 1 && l <= 3) state.listing = l;
  const s = url.searchParams.get('sort');
  if (s && SORT_KEYS.includes(s)) state.sort = s;
}

function persistListing() {
  const url = new URL(window.location);
  url.searchParams.set('layout', String(state.listing));
  window.history.replaceState({}, '', url);
}

function persistSort() {
  const url = new URL(window.location);
  url.searchParams.set('sort', state.sort);
  window.history.replaceState({}, '', url);
}

// "2 days ago" -> "2d", "1 week ago" -> "1w", "yesterday" -> "1d"
function shortTime(s) {
  if (!s) return '';
  if (s === 'yesterday') return '1d';
  const m = s.match(/(\d+)\s*(day|week|month|hour)/i);
  if (m) return m[1] + m[2][0].toLowerCase();
  return s;
}

function typeDividerHtml(type, count, variant /* 'cards' | 'ledger' */) {
  const tone = VA_TONE[type];
  const cls = variant === 'ledger' ? 'va-type-divider va-type-divider--thin' : 'va-type-divider';
  return `
    <li class="${cls}" role="presentation" style="--tone:${tone}">
      <span class="va-type-divider-bar"></span>
      <span class="va-type-divider-label">${escapeHtml(type)}</span>
      <span class="va-type-divider-count mono">${count}</span>

}

function renderListingBody(sorted) {
  if (state.listing === 2) return renderListingLedger(sorted);
  if (state.listing === 3) return renderListingGrouped(sorted);
  return renderListingCards(sorted);
}

function renderListingCards(sorted) {
  const showDividers = state.sort === 'type';
  const counts = showDividers ? countByType(sorted) : null;
  let prevType = null;
  const rows = [];
  sorted.forEach((s, i) => {
    if (showDividers && s.type !== prevType) {
      rows.push(typeDividerHtml(s.type, counts.get(s.type), 'cards'));
    }
    const a = accountById(s.accountId);
    const active = s.id === state.selectedSignalId;
    const t = VA_TONE[s.type];
    rows.push(`
      <li class="va-item ${active?'is-active':''}" data-act="select-signal" data-id="${s.id}" style="--i:${i}; --tone:${t}">
        <div class="va-item-rank mono">${String(i+1).padStart(2,'0')}</div>
        <div class="va-item-body">
          <div class="va-item-row1">
            <span class="va-type">
              <span class="va-type-dot" style="background:${t}"></span>
              <span class="va-type-name">${escapeHtml(s.type)}</span>
            </span>
            <span class="va-item-time mono">${escapeHtml(s.detectedAt)}</span>
          </div>
          <div class="va-item-account">${escapeHtml(a.name)}</div>
          <div class="va-item-meta mono">${fmtMoneyFull(a.arr)} · ${escapeHtml(a.plan)} · ${escapeHtml(a.owner)}</div>
          <div class="va-item-summary">${escapeHtml(s.summary)}</div>

            <span class="va-urgency u-${s.urgency}">${s.urgency}</span>
            <span class="va-item-tix mono">${s.ticketIds.length} sources</span>
            ${active ? '<span class="va-item-current mono">▸ OPEN</span>' : ''}
          </div>
        </div>
      </li>`);
    prevType = s.type;
  });
  return `<ul class="va-queue-list">${rows.join('')}</ul>`;
}

function renderListingLedger(sorted) {
  const showDividers = state.sort === 'type';
  const counts = showDividers ? countByType(sorted) : null;
  let prevType = null;
  const rows = [];
  sorted.forEach((s, i) => {
    if (showDividers && s.type !== prevType) {
      rows.push(typeDividerHtml(s.type, counts.get(s.type), 'ledger'));
    }
    const a = accountById(s.accountId);
    const active = s.id === state.selectedSignalId;
    const t = VA_TONE[s.type];
    const uLetter = s.urgency === 'high' ? 'H' : s.urgency === 'medium' ? 'M' : 'L';
    rows.push(`
      <li class="va-ledger-row ${active?'is-active':''}" data-act="select-signal" data-id="${s.id}" title="${escapeHtml(s.type)} · ${escapeHtml(s.summary)}" style="--i:${i}; --tone:${t}">
        <span class="va-ledger-rank">${String(i+1).padStart(2,'0')}</span>
        <span class="va-ledger-dot" style="background:${t}" aria-label="${escapeHtml(s.type)}"></span>
        <span class="va-ledger-account">${escapeHtml(a.name)}</span>
        <span class="va-ledger-arr">${fmtMoney(a.arr)}</span>
        <span class="va-ledger-urgency u-${s.urgency}" aria-label="${escapeHtml(s.urgency)} priority">${uLetter}</span>
        <span class="va-ledger-time">${escapeHtml(shortTime(s.detectedAt))}</span>

    prevType = s.type;
  });
  return `<ul class="va-list-ledger">${rows.join('')}</ul>`;
}

function renderListingGrouped(sorted) {
  // Preserve order: types appear in the order their first signal appears (already ARR-weighted).
  const groups = new Map();
  for (const s of sorted) {
    if (!groups.has(s.type)) groups.set(s.type, []);
    groups.get(s.type).push(s);
  }
  return `
    <div class="va-list-grouped">
      ${[...groups.entries()].map(([type, items], gi) => {
        const tone = VA_TONE[type];
        return `
        <section class="va-group" style="--tone:${tone}; --gi:${gi}">
          <header class="va-group-header">
            <span class="va-group-bar"></span>
            <span class="va-group-name">${escapeHtml(type)}</span>

          <ul class="va-group-items">
            ${items.map((s,i) => {
              const a = accountById(s.accountId);
              const active = s.id === state.selectedSignalId;
              return `
              <li class="va-group-item ${active?'is-active':''}" data-act="select-signal" data-id="${s.id}" style="--tone:${tone}">
                <div class="va-group-item-rank mono">${String(i+1).padStart(2,'0')}</div>
                <div>
                  <div class="va-group-item-head">
                    <span class="va-group-item-account">${escapeHtml(a.name)}</span>
                    <span class="va-group-item-arr mono">${fmtMoney(a.arr)}</span>
                    <span class="va-group-item-time mono">${escapeHtml(s.detectedAt)}</span>
                  </div>
                  <div class="va-group-item-summary">${escapeHtml(s.summary)}</div>
                  <div class="va-group-item-foot">
                    <span class="va-urgency u-${s.urgency}">${s.urgency}</span>
                    <span class="va-item-tix mono">${s.ticketIds.length} sources · ${escapeHtml(a.owner)}</span>
                  </div>
                </div>
              </li>`;
            }).join('')}
          </ul>
        </section>`;
      }).join('')}
    </div>`;
}

/* Wiring                                                               */
/* ------------------------------------------------------------------ */
function render() {
  document.getElementById('app').innerHTML = renderVariantA();
}

document.addEventListener('click', e => {
  // close any open sort popover when clicking outside of it
  if (!e.target.closest('.va-sort')) {
    document.querySelectorAll('.va-sort[open]').forEach(d => d.removeAttribute('open'));
  }
  const t = e.target.closest('[data-act]');
  if (!t) return;
  const act = t.getAttribute('data-act');
  if (act === 'select-signal') { state.selectedSignalId = t.getAttribute('data-id'); render(); }
  if (act === 'set-listing')   { state.listing = parseInt(t.getAttribute('data-id'), 10); persistListing(); render(); }
  if (act === 'set-sort')      { state.sort = t.getAttribute('data-id'); persistSort(); render(); }
});

document.addEventListener('keydown', e => {
  const tag = (e.target.tagName || '').toLowerCase();
  if (tag === 'input' || tag === 'textarea' || e.target.isContentEditable) return;
  // 1 / 2 / 3 cycles the listing layout
  if (e.key === '1' || e.key === '2' || e.key === '3') {
    state.listing = parseInt(e.key, 10);
    persistListing();
    render();
  }
});

readStateFromUrl();
render();
</script>
</body>
</html>
